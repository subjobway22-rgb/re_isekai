<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>리:이세계 UI 목업</title>
<style>
:root{--dk:#5a3a22;--md:#8a5a34;--gold:#e8b030;--yel:#f7c531;--cream:#fff4d6;--u:../assets/ui/slices}
*{box-sizing:border-box;margin:0}
body{background:#2b1d12;display:flex;justify-content:center;font-family:"DotGothic16","Galmuri11",system-ui,sans-serif;color:var(--cream)}
.app{width:100%;max-width:420px;height:100vh;max-height:860px;display:flex;flex-direction:column;background:var(--dk);position:relative;overflow:hidden}
.hud{display:flex;gap:4px;padding:6px 6px 4px;background:var(--dk)}
.pill{flex:1;height:30px;background:url(../assets/ui/slices/bar_currency.png) 0 0/100% 100% no-repeat;display:flex;align-items:center;justify-content:flex-end;padding:0 12px 0 34px;font-size:13px}
.pill{position:relative}.pill img{position:absolute;left:3px;top:50%;transform:translateY(-50%);width:26px;height:26px}
.avatar{width:34px;height:34px;border:2px solid var(--gold);border-radius:8px;background:var(--yel);display:grid;place-items:center;font-size:20px}
.field{flex:0 0 40%;position:relative;overflow:hidden;background:linear-gradient(#8ed1f0 0 55%,#bfe8f7)}
.mount{position:absolute;bottom:26%;left:-5%;width:60%;height:55%;background:#c9d3d8;clip-path:polygon(0 100%,25% 20%,45% 45%,70% 0,100% 100%)}
.mount.b{left:45%;width:70%;height:45%;background:#b3c0c7}
.ground{position:absolute;bottom:0;left:0;right:0;height:28%;background:#6ab04c;border-top:4px solid #3f7a2c;background-image:repeating-linear-gradient(90deg,transparent 0 14px,#5a9c3f 14px 18px)}
.banner{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:170px;height:42px;background:url(../assets/ui/slices/ribbon_banner.png) center/100% 100% no-repeat;color:var(--dk);font-weight:bold;font-size:14px;display:grid;place-items:center;padding-bottom:4px}
.side{position:absolute;top:54px;display:flex;flex-direction:column;gap:4px}
.side.l{left:4px}.side.r{right:4px}
.side img{width:40px;height:40px}
.hero{position:absolute;left:28%;bottom:24%;font-size:44px;animation:bob .6s steps(2) infinite}
.pet{position:absolute;left:17%;bottom:24%;font-size:26px;animation:bob .6s .3s steps(2) infinite}
.mon{position:absolute;right:20%;bottom:24%;font-size:44px}
.hp{position:absolute;right:12%;bottom:calc(24% + 56px);width:84px;height:14px;background:url(../assets/ui/slices/bar_hp_monster.png) 0 0/100% 100% no-repeat}
.dmg{position:absolute;right:30%;bottom:46%;color:var(--yel);font-size:20px;text-shadow:2px 2px 0 #000;animation:up 1.2s steps(6) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes up{to{transform:translateY(-24px);opacity:0}}
/* 9-slice wood panel */
.panel{flex:1;display:flex;flex-direction:column;gap:6px;padding:8px;overflow:auto;
 border:26px solid transparent;border-image:url(../assets/ui/slices/panel_wood.png) 130 fill/26px stretch;margin:-2px 0 0}
.tabs{display:flex;gap:4px}
.tab{flex:1;text-align:center;padding:4px 0;background:var(--dk);border:2px solid var(--gold);border-radius:8px 8px 0 0;font-size:12px}
.tab.on{background:var(--yel);color:var(--dk);font-weight:bold}
.row{display:flex;align-items:center;gap:8px;background:rgba(40,22,10,.55);border:2px solid var(--dk);border-radius:10px;padding:5px}
.row img.ic{width:40px;height:40px}
.row .tx{flex:1;font-size:12px;line-height:1.35}.row .tx small{opacity:.8}
/* 9-slice yellow button */
.btn{border:14px solid transparent;border-image:url(../assets/ui/slices/btn_yellow_hi.png) 60 70 90 60 fill/14px 14px 18px 14px stretch;
 color:var(--dk);font-weight:bold;font-size:13px;text-align:center;line-height:1.2;padding:0 6px;min-width:70px;cursor:pointer}
.btn:active{border-image-source:url(../assets/ui/slices/btn_yellow_pressed_hi.png);transform:translateY(2px)}
.btn.wide{flex:1;font-size:15px}
.slots{display:flex;gap:4px}
.slots img{flex:1;min-width:0;aspect-ratio:1;object-fit:contain}
.start{display:flex;gap:6px}
.nav{display:flex;background:var(--dk);border-top:3px solid var(--gold)}
.nav div{flex:1;text-align:center;padding:4px 0 6px;font-size:11px;opacity:.75}
.nav div img{display:block;width:36px;height:36px;margin:0 auto 1px}
.nav .on{opacity:1;background:#7a4d2b;color:var(--yel);font-weight:bold}
</style></head><body>
<div class="app">
 <div class="hud"><div class="avatar">🧑</div>
  <div class="pill"><img src="../assets/ui/slices/icon_energy.png">30/30</div><div class="pill"><img src="../assets/ui/slices/icon_gold.png">12.4K</div><div class="pill"><img src="../assets/ui/slices/icon_gem.png">100</div></div>
 <div class="field">
  <div class="mount"></div><div class="mount b"></div><div class="ground"></div>
  <div class="banner">STAGE 1 - 3</div>
  <div class="side l"><img src="../assets/ui/slices/menu_quest.png"><img src="../assets/ui/slices/menu_store.png"></div>
  <div class="side r"><img src="../assets/ui/slices/menu_rank.png"><img src="../assets/ui/slices/menu_gift.png"></div>
  <div class="pet">🐱</div><div class="hero">🧑‍🎤</div>
  <div class="hp"></div><div class="mon">🟢</div><div class="dmg">1,284!</div>
 </div>
 <div class="panel">
  <div class="tabs"><div class="tab on">공격력</div><div class="tab">공속</div><div class="tab">치명타</div><div class="tab">체력</div></div>
  <div class="row"><img class="ic" src="../assets/ui/slices/nav_adventure.png"><div class="tx"><b>공격력 Lv.24</b><br><small>ATK 77 → 80</small></div><div class="btn">840<br>강화</div></div>
  <div class="row"><img class="ic" src="../assets/ui/slices/nav_accessory.png"><div class="tx"><b>장착 악세사리</b><br><small>ATK +12% · 치명 +4%</small></div></div>
  <div class="slots"><img src="../assets/ui/slices/slot_g3_rare.png"><img src="../assets/ui/slices/slot_g2_uncommon.png"><img src="../assets/ui/slices/slot_g5_legend.png"><img src="../assets/ui/slices/slot_equip_a.png"><img src="../assets/ui/slices/slot_equip_b.png"></div>
  <div class="start"><div class="btn wide">보스 도전</div><div class="btn wide">소환 300</div></div>
 </div>
 <div class="nav">
  <div><img src="../assets/ui/slices/nav_growth.png">성장</div>
  <div><img src="../assets/ui/slices/nav_accessory.png">악세사리</div>
  <div class="on"><img src="../assets/ui/slices/nav_adventure.png">모험</div>
  <div><img src="../assets/ui/slices/nav_partner.png">파트너</div>
  <div><img src="../assets/ui/slices/nav_shop.png">상점</div>
 </div>
</div></body></html>
