<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>리:이세계 UI 목업</title>
<style>
:root{--dk:#5a3a22;--md:#8a5a34;--gold:#e8b030;--yel:#f7c531;--grass:#6ab04c;--sky:#8ed1f0;--cream:#fff4d6;--red:#d6403a}
*{box-sizing:border-box;margin:0}
body{background:#2b1d12;display:flex;justify-content:center;font-family:"DotGothic16","Galmuri11",system-ui,sans-serif;color:var(--cream)}
.app{width:100%;max-width:420px;height:100vh;max-height:860px;display:flex;flex-direction:column;background:var(--dk);position:relative;overflow:hidden}
.hud{display:flex;gap:6px;padding:6px;background:var(--dk);border-bottom:3px solid var(--gold)}
.pill{flex:1;background:#3b2414;border:2px solid var(--gold);border-radius:12px;padding:3px 8px;font-size:13px;text-align:right;white-space:nowrap}
.avatar{width:34px;height:34px;border:2px solid var(--gold);border-radius:8px;background:var(--yel);display:grid;place-items:center;font-size:20px}
.field{flex:0 0 42%;position:relative;overflow:hidden;background:linear-gradient(var(--sky) 0 55%,#bfe8f7)}
.mount{position:absolute;bottom:26%;left:-5%;width:60%;height:55%;background:#c9d3d8;clip-path:polygon(0 100%,25% 20%,45% 45%,70% 0,100% 100%)}
.mount.b{left:45%;width:70%;height:45%;background:#b3c0c7}
.ground{position:absolute;bottom:0;left:0;right:0;height:28%;background:var(--grass);border-top:4px solid #3f7a2c;
 background-image:repeating-linear-gradient(90deg,transparent 0 14px,#5a9c3f 14px 18px)}
.banner{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--yel);color:var(--dk);border:3px solid var(--dk);padding:2px 18px;font-weight:bold;font-size:14px;clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%)}
.side{position:absolute;top:44px;display:flex;flex-direction:column;gap:6px}
.side.l{left:6px}.side.r{right:6px}
.ico{width:38px;height:38px;border:2px solid var(--gold);background:var(--md);border-radius:8px;display:grid;place-items:center;font-size:20px;box-shadow:0 2px 0 var(--dk)}
.hero{position:absolute;left:28%;bottom:24%;font-size:44px;animation:bob .6s steps(2) infinite}
.pet{position:absolute;left:17%;bottom:24%;font-size:26px;animation:bob .6s .3s steps(2) infinite}
.mon{position:absolute;right:20%;bottom:24%;font-size:44px}
.hp{position:absolute;right:16%;bottom:calc(24% + 56px);width:64px;height:8px;background:#400;border:2px solid #000}
.hp i{display:block;height:100%;width:70%;background:var(--red)}
.dmg{position:absolute;right:30%;bottom:46%;color:var(--yel);font-size:20px;text-shadow:2px 2px 0 #000;animation:up 1.2s steps(6) infinite}
.drop{position:absolute;left:38%;bottom:calc(24% + 52px);background:var(--yel);color:var(--dk);border:2px solid var(--dk);padding:1px 8px;font-size:12px}
@keyframes bob{50%{transform:translateY(-4px)}}
@keyframes up{to{transform:translateY(-24px);opacity:0}}
.panel{flex:1;margin:0;padding:8px;background:var(--md);border-top:4px solid var(--gold);overflow:auto;display:flex;flex-direction:column;gap:8px}
.tabs{display:flex;gap:4px}
.tab{flex:1;text-align:center;padding:5px 0;background:var(--dk);border:2px solid var(--gold);border-radius:8px 8px 0 0;font-size:13px}
.tab.on{background:var(--yel);color:var(--dk);font-weight:bold}
.row{display:flex;align-items:center;gap:8px;background:#6b4426;border:2px solid var(--dk);border-radius:10px;padding:6px}
.row .ic{width:42px;height:42px;background:var(--cream);color:var(--dk);border-radius:8px;display:grid;place-items:center;font-size:24px;border:2px solid var(--gold)}
.row .tx{flex:1;font-size:13px;line-height:1.35}.row .tx small{opacity:.8}
.btn{background:var(--yel);color:var(--dk);border:3px solid var(--dk);border-radius:10px;padding:6px 10px;font-weight:bold;font-size:13px;text-align:center;box-shadow:0 3px 0 var(--dk);font-family:inherit}
.slots{display:flex;gap:6px}
.slot{flex:1;aspect-ratio:1;border:3px solid;border-radius:8px;display:grid;place-items:center;font-size:22px;background:#3b2414}
.g1{border-color:#999}.g2{border-color:#5fbf5f}.g3{border-color:#4a8be8}.g4{border-color:#a45be8}.g5{border-color:#f08a24}.g0{border-style:dashed;border-color:var(--md)}
.start{display:flex;gap:8px}
.start .btn{flex:1;font-size:16px;padding:10px}
.nav{display:flex;background:var(--dk);border-top:3px solid var(--gold)}
.nav div{flex:1;text-align:center;padding:6px 0 8px;font-size:11px}
.nav div span{display:block;font-size:22px}
.nav .on{background:var(--yel);color:var(--dk);font-weight:bold}
</style></head><body>
<div class="app">
 <div class="hud"><div class="avatar">🧑</div><div class="pill">⚡ 30/30</div><div class="pill">🪙 12.4K</div><div class="pill">💎 100</div></div>
 <div class="field">
  <div class="mount"></div><div class="mount b"></div><div class="ground"></div>
  <div class="banner">STAGE 1 - 3</div>
  <div class="side l"><div class="ico">📜</div><div class="ico">🏪</div></div>
  <div class="side r"><div class="ico">🏆</div><div class="ico">🎁</div></div>
  <div class="pet">🐱</div><div class="hero">🧑‍🎤</div>
  <div class="drop">악세사리 획득 ×1</div>
  <div class="hp"><i></i></div><div class="mon">🟢</div><div class="dmg">1,284!</div>
 </div>
 <div class="panel">
  <div class="tabs"><div class="tab on">공격력</div><div class="tab">공속</div><div class="tab">치명타</div><div class="tab">체력</div></div>
  <div class="row"><div class="ic">⚔️</div><div class="tx"><b>공격력 Lv.24</b><br><small>ATK 77 → 80</small></div><div class="btn">🪙 840<br>강화</div></div>
  <div class="row"><div class="ic">💍</div><div class="tx"><b>장착 악세사리</b><br><small>ATK +12% · 치명 +4%</small></div></div>
  <div class="slots"><div class="slot g3">💍</div><div class="slot g2">📿</div><div class="slot g4">🧿</div><div class="slot g0">+</div><div class="slot g0">+</div></div>
  <div class="start"><div class="btn">보스 도전 ⚔️</div><div class="btn">소환 💎 300</div></div>
 </div>
 <div class="nav"><div><span>📈</span>성장</div><div><span>💍</span>악세사리</div><div class="on"><span>🗡️</span>모험</div><div><span>🐾</span>파트너</div><div><span>🛒</span>상점</div></div>
</div></body></html>
